<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tilely</title>
<meta name="description" content="Okul öncesi ve 1-2. sınıflar için örnek deseni kopyalama ve simetri tamamlama oyunu.">
<link rel="icon" href="../assets/logos/mozaik.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Tilely · Furkan Kale
   Yerleşim: yatay ekranda [örnek + araçlar | büyük tahta | renkler], dikey ekranda üstten alta.
   Tek, açık tema: çocuklar için sıcak kâğıt zemin, doygun ama uyumlu karo renkleri. */
:root{
  --paper:#FFF7EA; --paper-dot:#F1E3CB; --card:#FFFFFF; --ink:#2B2340; --muted:#7A6F8E; --line:#E9DCC6;
  --accent:#FF7A45; --accent-ink:#B4461C; --ok:#2A9D5C; --bad:#E63946; --focus:#3A86FF;
  --empty:#FFFDF8; --empty-line:#E7D9C2;
  --font:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --radius:18px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);background-image:radial-gradient(var(--paper-dot) 1.5px,transparent 2px);background-size:26px 26px;color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:14px}
svg{display:block}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

/* ---------- üst çubuk ---------- */
.bar{display:flex;align-items:center;gap:10px;min-height:58px}
.ibtn{width:54px;height:54px;flex:none;border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--line),0 8px 18px -12px rgba(43,35,64,.35);display:grid;place-items:center;transition:transform .12s}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ibtn svg{width:28px;height:28px}
.ibtn[aria-pressed="false"] svg{opacity:.4}
.title{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.title .lvl{font-weight:800;font-size:15px;color:var(--accent-ink);background:#FFE7D6;border-radius:999px;padding:4px 12px;white-space:nowrap}
.title h1{font-size:clamp(20px,3.2vw,30px);font-weight:800;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:flex;gap:2px}
.stars svg{width:26px;height:26px}

/* ---------- oyun alanı ---------- */
#game{flex:1;min-height:0;display:grid;gap:16px;padding-top:10px;grid-template-columns:minmax(220px,26%) 1fr auto;grid-template-areas:"side board pal"}
.side{grid-area:side;display:flex;flex-direction:column;gap:14px;min-height:0}
.boardwrap{grid-area:board;min-width:0;min-height:0;display:grid;place-items:center;position:relative}
.pal{grid-area:pal;display:flex;flex-direction:column;gap:12px;justify-content:center;align-items:center}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 4px 0 var(--line),0 14px 30px -20px rgba(43,35,64,.4)}
.target{padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.target .tag{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--muted)}
.target .tag svg{width:22px;height:22px}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:76px;border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:15px;color:var(--muted);transition:transform .12s}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tool svg{width:30px;height:30px}
.tool.check{grid-column:1/-1;background:var(--ok);color:#fff;box-shadow:0 4px 0 #1E7445;font-size:20px;height:70px;flex-direction:row;gap:10px}
.right{display:flex;flex-direction:column;gap:12px}
.progress{height:14px;border-radius:999px;background:#F3E8D6;overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#FFD60A,#2A9D5C);transition:width .3s}
.msg{min-height:28px;text-align:center;font-weight:700;font-size:17px;color:var(--muted)}

/* ızgaralar */
.grid{display:grid;background:var(--empty-line);border-radius:12px;padding:var(--gap);gap:var(--gap);touch-action:none;position:relative}
.cell{position:relative;border-radius:calc(var(--cs) * .16);background:var(--empty);transition:background-color .12s,transform .12s;overflow:hidden}
.cell.on{box-shadow:inset 0 -.12em 0 rgba(0,0,0,.14),inset 0 .1em 0 rgba(255,255,255,.35)}
.board .cell{cursor:pointer}
.board .cell:not(.on)::after{content:"";position:absolute;left:50%;top:50%;width:14%;height:14%;margin:-7% 0 0 -7%;border-radius:50%;background:var(--empty-line)}
.cell .sym{position:absolute;inset:22%;opacity:.55;pointer-events:none}
.board .cell.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.78)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
.board .cell.wrong::before{content:"";position:absolute;right:0;top:0;width:34%;height:34%;background:var(--bad);clip-path:polygon(0 0,100% 0,100% 100%);z-index:2}
.board .cell.wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
.board .cell.missing{outline:3px dashed var(--bad);outline-offset:-4px}
.cell.locked{filter:saturate(.85)}
.board.mirror .cell.locked{opacity:.9}
.cell.flash{animation:flash .5s ease-in-out 3}
@keyframes flash{50%{box-shadow:0 0 0 calc(var(--cs) * .12) #FFD60A inset;transform:scale(1.08)}}
.grid .cross-r,.grid .cross-c{position:absolute;pointer-events:none;border:3px dashed var(--focus);border-radius:10px;display:none;z-index:2}
.grid.show-cross .cross-r,.grid.show-cross .cross-c{display:block}
.grid .cross-cell{position:absolute;pointer-events:none;border:4px solid var(--focus);border-radius:10px;display:none;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--focus);z-index:3}
.grid.show-cross .cross-cell{display:block}
.mirrorline{position:absolute;top:-10px;bottom:-10px;width:0;border-left:4px dashed var(--accent);pointer-events:none;z-index:3}

/* renk paleti */
.sw{width:72px;height:72px;border-radius:20px;position:relative;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .15s}
.sw:active{transform:scale(.94)}
.sw[aria-checked="true"]{transform:scale(1.12);box-shadow:0 0 0 5px #fff,0 0 0 9px var(--ink),0 8px 16px -6px rgba(0,0,0,.4)}
.sw .sym{position:absolute;inset:26%;opacity:.6}
.sw.eraser{background:#fff;box-shadow:0 4px 0 var(--line)}
.sw.eraser svg{width:60%;height:60%}
.sw.flash{animation:swflash .5s ease-in-out 3}
@keyframes swflash{50%{transform:scale(1.2) rotate(-6deg)}}
.sw.eraser[aria-checked="true"]{box-shadow:0 0 0 5px #fff,0 0 0 9px var(--ink)}

/* ---------- dikey ekran ---------- */
@media (max-aspect-ratio: 11/10){
  #game{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"side" "board" "pal";gap:10px}
  .side{flex-direction:row;align-items:stretch}
  .target{flex:none;padding:10px}
  .target .tag{font-size:15px}
  .side .right{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  .tools{grid-template-columns:repeat(4,1fr);gap:8px}
  .tool{height:62px;font-size:13px}
  .tool.check{grid-column:auto;height:62px;font-size:15px;flex-direction:column;gap:0}
  .pal{flex-direction:row;flex-wrap:wrap;gap:10px}
  .sw{width:58px;height:58px;border-radius:16px}
  .msg{font-size:15px;min-height:22px}
}
@media (max-aspect-ratio: 11/10) and (min-width:600px){
  .sw{width:80px;height:80px;border-radius:22px}
  .tool{height:76px;font-size:16px}
  .tool.check{height:76px;font-size:17px}
  .target{padding:14px}
}
@media (max-aspect-ratio: 11/10) and (max-width:520px){
  .tools{grid-template-columns:repeat(2,1fr)}
  .tool{height:50px;flex-direction:row;gap:6px}
  .tool svg{width:24px;height:24px}
  .sw{width:50px;height:50px}
  .title .lvl{display:none}
  .title .stars{display:none}
  .ibtn{width:46px;height:46px;border-radius:14px}
  .ibtn svg{width:24px;height:24px}
  #btnFull{display:none}
  .bar{gap:8px}
}

/* ---------- ekranlar ---------- */
.screen{position:fixed;inset:0;z-index:30;overflow:auto;background:var(--paper);background-image:radial-gradient(var(--paper-dot) 1.5px,transparent 2px);background-size:26px 26px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.menu{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.back{align-self:flex-start;font-weight:700;font-size:16px;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--card);box-shadow:0 2px 0 var(--line)}
.back:hover{color:var(--ink)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:8px}
.logo{display:flex;align-items:center;gap:16px}
.logo .mark{display:grid;grid-template-columns:repeat(3,22px);gap:4px}
.logo .mark i{width:22px;height:22px;border-radius:6px}
.logo h2{font-size:clamp(34px,6vw,56px);font-weight:800;line-height:.95}
.logo p{font-size:clamp(16px,2.2vw,20px);color:var(--muted);font-weight:600;margin-top:6px}
.cont{display:flex;align-items:center;gap:12px;background:var(--accent);color:#fff;font-weight:800;font-size:24px;padding:16px 28px;border-radius:20px;box-shadow:0 5px 0 var(--accent-ink)}
.cont svg{width:30px;height:30px}
.cont:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-ink)}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:20px}
.tab small{font-weight:700;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}
.tab[aria-selected="true"] small{color:#CFC6E3}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.lv{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 12px 12px;border-radius:var(--radius);background:var(--card);box-shadow:0 4px 0 var(--line);transition:transform .12s;position:relative}
.lv:active{transform:translateY(3px)}
.lv .no{position:absolute;left:10px;top:8px;font-weight:800;font-size:14px;color:var(--muted)}
.lv .mode{position:absolute;z-index:2;right:8px;top:8px;font-weight:800;font-size:12px;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px}
.lv b{font-weight:800;font-size:19px;line-height:1.1;text-align:center}
.lv .meta{font-size:14px;font-weight:700;color:var(--muted)}
.lv .stars svg{width:20px;height:20px}
.thumb{--cs:10px;--gap:2px}
.foot{text-align:center;color:var(--muted);font-weight:600;font-size:14px;padding-top:6px}
.foot a{color:inherit}

/* kutlama ve ayarlar */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(43,35,64,.45);padding:20px}
.dialog{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:rise .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}}
.dialog h3{font-size:clamp(34px,6vw,48px);font-weight:800;line-height:1}
.dialog p{font-size:19px;color:var(--muted);font-weight:600;text-align:center}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:clamp(60px,14vw,86px);height:auto}
.bigstars svg.on{animation:starin .5s cubic-bezier(.2,1.6,.4,1) backwards}
.bigstars svg:nth-child(2){animation-delay:.15s}.bigstars svg:nth-child(3){animation-delay:.3s}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pill{display:flex;align-items:center;gap:8px;padding:14px 22px;border-radius:18px;font-weight:800;font-size:20px;background:#F3E8D6;box-shadow:0 4px 0 var(--line)}
.pill svg{width:26px;height:26px}
.pill.go{background:var(--ok);color:#fff;box-shadow:0 4px 0 #1E7445}
.pill:active{transform:translateY(3px)}
.set{width:100%;display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-radius:16px;background:#FBF4E8;font-weight:700;font-size:18px;text-align:left}
.opt small{display:block;font-weight:600;font-size:14px;color:var(--muted)}
.sw2{flex:none;width:62px;height:36px;border-radius:999px;background:#D9CDB8;position:relative;transition:background .2s}
.sw2::after{content:"";position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.opt[aria-checked="true"] .sw2{background:var(--ok)}
.opt[aria-checked="true"] .sw2::after{left:30px}
.danger{color:var(--bad)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<!-- Kutlama -->
<div class="overlay" id="win" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="bigstars" id="winStars"></div>
    <h3 id="winTitle">Harika!</h3>

const sfxWrong = () => { tone(220, .14, 'square', .06); tone(185, .18, 'square', .05, .08); };
